<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Test · Prototype</title>
<style>
:root{
  --wall-1:#030604; --wall-2:#0a1f14; --wall-3:#145a35; --wall-glow:rgba(61,220,132,.16);
  --glass:rgba(12,22,16,.82); --glass-edge:rgba(61,220,132,.26); --glass-text:#d8f5e3;
  --pane:#0c130f; --ink:#e6f2ea; --ink-soft:#8fa898; --accent:#3ddc84;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Segoe UI","Segoe UI Variable","Noto Sans","Helvetica Neue",Arial,sans-serif;
  font-size:13px;color:var(--ink);overflow:hidden;background:var(--wall-1);
  -webkit-font-smoothing:antialiased;
}
#desktop{
  position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(120% 70% at 72% 112%, var(--wall-3) 0%, transparent 58%),
    radial-gradient(80% 55% at 8% -12%, var(--wall-glow), transparent 62%),
    linear-gradient(162deg, var(--wall-1) 0%, var(--wall-2) 100%);
}
.window{
  position:absolute;inset:0;background:var(--glass);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
  box-shadow:inset 0 0 0 1px var(--glass-edge);
  display:flex;flex-direction:column;
}
.titlebar{height:30px;flex:none;display:flex;align-items:center;padding:0 9px;gap:7px;color:var(--glass-text)}
.titlebar .ttl{flex:1;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar .ttl b{color:var(--accent);font-weight:600}
.win-inner{flex:1;display:grid;place-items:center;min-height:0;background:var(--pane);border-top:1px solid rgba(0,0,0,.35)}
h1{margin:0;font-size:clamp(96px,28vw,360px);font-weight:700;letter-spacing:.04em;line-height:1;color:var(--ink)}
</style>
</head>
<body>
<div id="desktop">
  <div class="window" role="main">
    <div class="titlebar"><span class="ttl"><b>Prototype</b> · Minimal test page</span></div>
    <div class="win-inner"><h1>TEST</h1></div>
  </div>
</div>
</body>
</html>
